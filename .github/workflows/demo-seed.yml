# بيانات العرض على الموقع الحي: شركة عرض لكل قطاع تحت حساب المالك (scripts/demo-seed.mjs). يُشغَّل يدويًا فقط.
# السر المطلوب: DEMO_PASSWORD (كلمة سائقي العرض، 8 أحرف فأكثر). مع share_with (إيميل دخولك) يُنشأ حساب مالك للتشغيل وحده
# وتصلك الشركات مديرًا؛ أو أضف DEMO_OWNER_EMAIL وDEMO_OWNER_PASSWORD لحساب مالك ثابت (يُنشأ في أول تشغيل إن لم يوجد).
name: demo-seed
on:
  workflow_dispatch:
    inputs:
      sectors:
        description: 'القطاعات: all أو أسماء مفصولة بفواصل (taxi,school)'
        default: all
        required: true
      share_with:
        description: 'إيميل حساب موجود يرى شركات العرض في لوحة التحكم (مدير)'
        required: false
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create the demo companies
        env:
          API_URL: https://api.q8hub.com
          OWNER_EMAIL: ${{ secrets.DEMO_OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.DEMO_OWNER_PASSWORD }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          SECTORS: ${{ inputs.sectors }}
          OWNER_REGISTER: '1'
          SHARE_WITH: ${{ inputs.share_with }}
        run: |
          [ -n "$DEMO_PASSWORD" ] || { echo "add the repository secret DEMO_PASSWORD (the demo drivers' password, 8+ characters) first"; exit 1; }
          if [ -z "$OWNER_EMAIL" ]; then
            # no owner secrets: a fresh owner account for this run only; the companies are reached through share_with
            [ -n "$SHARE_WITH" ] || { echo "without the DEMO_OWNER_* secrets, share_with (your login email) is required"; exit 1; }
            OWNER_EMAIL="owner-${GITHUB_RUN_ID}@demo.q8hub.com"; OWNER_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=\n')
            echo "::add-mask::$OWNER_PASSWORD"; export OWNER_EMAIL OWNER_PASSWORD
          fi
          node scripts/demo-seed.mjs "$SECTORS"
