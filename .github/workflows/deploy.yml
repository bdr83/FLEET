name: deploy
# النشر إلى خادم التجربة بضغطة زر: Actions → deploy → Run workflow.
# الإعداد مرة واحدة في Settings → Secrets and variables → Actions:
#   Secrets:   DEPLOY_HOST (عنوان IP)، DEPLOY_SSH_KEY (مفتاح SSH خاص)، SMS_HTTP_URL، SMS_HTTP_HEADERS، SMS_HTTP_BODY
#   Variables: SERVER_ENV (أسطر KEY=VALUE تغني عن البقية)، أو منفصلة: APP_DOMAIN، API_DOMAIN، DEPLOY_USER (افتراضيًا root)، SMS_HTTP_FORM (اختياري)،
#              COMPOSE_FILE، EDGE_NETWORK، NGINX_CONTAINER، NGINX_CONF، ACME_WEBROOT، ACME_WEBROOT_IN (خادم مشترك فيه nginx)
#              COMPOSE_PROFILES (caddy لخادم مخصص، فارغ لخادم مشترك خلف وكيل موجود)، API_PORT/WEB_PORT، MANAGE_FIREWALL (1 لخادم مخصص)
# أسرار قاعدة البيانات والجلسات تُولَّد على الخادم نفسه أول مرة ولا تمر بـ GitHub.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: وسم الصور (latest أو رقم التزام)
        default: latest
        required: true
      proxy_setup:
        description: إضافة النطاقين إلى nginx الموجود على الخادم المشترك (أول مرة)
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER_: ${{ vars.DEPLOY_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key and host
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$HOST" || { echo "DEPLOY_HOST secret is missing"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # المفتاح كما لُصق في GitHub قد يحمل CR أو مسافات زائدة أو يأتي في سطر واحد: نعيده للصيغة القياسية
          umask 077
          python3 - > ~/.ssh/id <<'PY'
          import os, re, textwrap
          k = os.environ["KEY"].replace("\r", "").strip()
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", k, re.S)
          if not m:
              raise SystemExit("DEPLOY_SSH_KEY does not look like a private key (no BEGIN/END lines)")
          body = re.sub(r"\s+", "", m.group(2))
          print(f"-----BEGIN {m.group(1)}-----")
          print("\n".join(textwrap.wrap(body, 70)))
          print(f"-----END {m.group(1)}-----")
          PY
          chmod 600 ~/.ssh/id
          ssh-keygen -y -f ~/.ssh/id > /dev/null || { echo "DEPLOY_SSH_KEY is not a valid private key: paste it again, the whole text from BEGIN to END"; exit 1; }
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts
      - name: Settings from GitHub
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          SMS_HTTP_URL: ${{ secrets.SMS_HTTP_URL }}
          SMS_HTTP_HEADERS: ${{ secrets.SMS_HTTP_HEADERS }}
          SMS_HTTP_BODY: ${{ secrets.SMS_HTTP_BODY }}
          SMS_HTTP_FORM: ${{ vars.SMS_HTTP_FORM }}
          COMPOSE_PROFILES: ${{ vars.COMPOSE_PROFILES }}
          API_PORT: ${{ vars.API_PORT }}
          WEB_PORT: ${{ vars.WEB_PORT }}
          COMPOSE_FILE: ${{ vars.COMPOSE_FILE }}
          EDGE_NETWORK: ${{ vars.EDGE_NETWORK }}
          NGINX_CONTAINER: ${{ vars.NGINX_CONTAINER }}
          NGINX_CONF: ${{ vars.NGINX_CONF }}
          ACME_WEBROOT: ${{ vars.ACME_WEBROOT }}
          ACME_WEBROOT_IN: ${{ vars.ACME_WEBROOT_IN }}
          SERVER_ENV: ${{ vars.SERVER_ENV }}
        run: |
          for k in APP_DOMAIN API_DOMAIN; do
            [ -n "${!k}" ] || printf '%s\n' "$SERVER_ENV" | grep -q "^$k=" || { echo "$k is required (variable or SERVER_ENV line)"; exit 1; }
          done
          umask 077
          {
            echo "APP_DOMAIN=$APP_DOMAIN"; echo "API_DOMAIN=$API_DOMAIN"   # empty values are ignored on the server
            if [ -n "$SMS_HTTP_URL" ]; then echo "SMS_PROVIDER=http"; fi
            echo "SMS_HTTP_URL=$SMS_HTTP_URL"; echo "SMS_HTTP_HEADERS=$SMS_HTTP_HEADERS"
            echo "SMS_HTTP_BODY=$SMS_HTTP_BODY"; echo "SMS_HTTP_FORM=$SMS_HTTP_FORM"
            echo "COMPOSE_PROFILES=${COMPOSE_PROFILES:-none}"; echo "API_PORT=$API_PORT"; echo "WEB_PORT=$WEB_PORT"
            for k in COMPOSE_FILE EDGE_NETWORK NGINX_CONTAINER NGINX_CONF ACME_WEBROOT ACME_WEBROOT_IN; do echo "$k=${!k}"; done
            # SERVER_ENV: متغير واحد متعدد الأسطر KEY=VALUE يغني عن المتغيرات المنفصلة (يُطبَّق أخيرًا)
            printf '%s\n' "$SERVER_ENV" | grep -E '^[A-Z_][A-Z0-9_]*=' || true
          } > deploy/config.env
      - name: Copy deploy files
        run: |
          ssh -i ~/.ssh/id "$USER_@$HOST" 'mkdir -p /opt/fleet/deploy'
          scp -i ~/.ssh/id deploy/docker-compose.yml deploy/Caddyfile deploy/.env.example deploy/backup.sh deploy/restore.sh deploy/update.sh deploy/remote.sh deploy/nginx-shared.sh deploy/docker-compose.shared.yml deploy/config.env "$USER_@$HOST:/opt/fleet/deploy/"
      - name: Pull and start
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          printf '%s\n' "$TOKEN" | ssh -i ~/.ssh/id "$USER_@$HOST" "cd /opt/fleet/deploy && GHCR_USER='${{ github.actor }}' TAG='$TAG' MANAGE_FIREWALL='${{ vars.MANAGE_FIREWALL }}' PROXY_SETUP='${{ inputs.proxy_setup && '1' || '0' }}' bash ./remote.sh"
