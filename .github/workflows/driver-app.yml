name: driver-app
on:
  workflow_dispatch:
  push:
    paths: ['apps/driver/**', '.github/workflows/driver-app.yml']
  pull_request:
    paths: ['apps/driver/**']
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.50.1', cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # API_URL comes from a repository variable; unsigned debug-key build for internal testing only
      - run: flutter build apk --release --dart-define=API_URL=${{ vars.DRIVER_API_URL || 'https://api.example.invalid' }}
      - uses: actions/upload-artifact@v4
        with:
          name: driver-apk
          path: apps/driver/build/app/outputs/flutter-apk/app-release.apk
